name: Guard badges branch

# Pushing to `badges` makes GitHub offer a "Compare & pull request" banner, and
# that offer is always wrong: `badges` is build output with an unrelated history
# and merging it would dump PNGs into the paper list. This fails any such PR
# rather than relying on nobody clicking the button.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    if: github.head_ref == 'badges'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::The 'badges' branch is build output and must never be merged into main."
          echo "It carries rendered PNGs on an unrelated history, refreshed by .github/workflows/badges.yml."
          echo "If GitHub offered this PR after an automated push, close it."
          exit 1
