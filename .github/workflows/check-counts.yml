name: Check the list

# Two ways this list has quietly gone wrong, both invisible in a rendered diff:
#
#   counts   each section states its size in three places (Contents, heading,
#            "Show N papers"), and a PR that touches one leaves the other two
#            lying about the section.
#   glosses  a backfill once cut nine annotations off mid-sentence, three of
#            them leaving a parenthesis open.
#   i18n     the translated READMEs (ko, zh-CN, ja, pt-BR, es) follow
#            README.md line for line, and an addition made in English only
#            leaves them a paper behind.
#
# All three are cheap to check and none is cheap to spot by eye.

on:
  pull_request:
    paths:
      - README*.md
      - scripts/*
  push:
    branches: [main]
    paths:
      - README*.md
      - scripts/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify section counts match the number of entries
        run: python3 scripts/sync_counts.py --check
      - name: Verify no gloss was cut off mid-sentence
        run: python3 scripts/check_glosses.py
      # Contributors edit README.md only and the maintainer brings the
      # translations along when merging, so on a pull request this reports
      # without failing the run.
      - name: Verify the translations still match README.md line for line
        run: python3 scripts/check_i18n.py
        continue-on-error: ${{ github.event_name == 'pull_request' }}
