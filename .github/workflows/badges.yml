name: Refresh badges

# The star/fork badges are self-hosted PNGs because GitHub's Camo proxy has
# repeatedly failed to fetch img.shields.io for this repo (see eccfb52), while
# raw.githubusercontent.com is served directly. This job re-renders them from
# the live GitHub API so self-hosting does not mean stale numbers.
#
# The PNGs live on the orphan `badges` branch, never on main: a bot commit on
# the default branch puts github-actions[bot] in the repo's contributor list
# next to the people who actually contributed papers.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour to avoid peak scheduling
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_badges.py
      - assets/fonts/Lato-Regular.ttf
      - .github/workflows/badges.yml

permissions:
  contents: write

concurrency:
  group: refresh-badges
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (scripts and the vendored font)
        uses: actions/checkout@v4

      - name: Check out the badges branch
        uses: actions/checkout@v4
        with:
          ref: badges
          path: badges-out

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Render badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_badges.py --out badges-out

      - name: Commit to the badges branch if a value changed
        working-directory: badges-out
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Badge values unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh badges"
          git push origin HEAD:badges
